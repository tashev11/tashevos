<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title">
<title id="title">TashevOS task lifecycle</title><rect width="1200" height="430" rx="28" fill="#0f172a"/>
<text x="60" y="62" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="34" font-weight="800">Every task becomes a verified handoff</text>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">
<g><rect x="55" y="130" width="150" height="82" rx="18" fill="#172554" stroke="#60a5fa"/><text x="130" y="164" fill="#dbeafe">DISCOVER</text><text x="130" y="188" fill="#93c5fd" font-size="13">AI + repo + task</text></g>
<g><rect x="245" y="130" width="150" height="82" rx="18" fill="#1e293b" stroke="#94a3b8"/><text x="320" y="164" fill="#e2e8f0">RECONCILE</text><text x="320" y="188" fill="#94a3b8" font-size="13">memory vs truth</text></g>
<g><rect x="435" y="130" width="150" height="82" rx="18" fill="#164e63" stroke="#22d3ee"/><text x="510" y="164" fill="#cffafe">CONTEXT</text><text x="510" y="188" fill="#67e8f9" font-size="13">minimum needed</text></g>
<g><rect x="625" y="130" width="150" height="82" rx="18" fill="#312e81" stroke="#a78bfa"/><text x="700" y="164" fill="#ede9fe">WORK</text><text x="700" y="188" fill="#c4b5fd" font-size="13">agent executes</text></g>
<g><rect x="815" y="130" width="150" height="82" rx="18" fill="#14532d" stroke="#4ade80"/><text x="890" y="164" fill="#dcfce7">VERIFY</text><text x="890" y="188" fill="#86efac" font-size="13">tests + build + diff</text></g>
<g><rect x="1005" y="130" width="150" height="82" rx="18" fill="#3f1d2e" stroke="#fb7185"/><text x="1080" y="164" fill="#ffe4e6">MEMORIZE</text><text x="1080" y="188" fill="#fda4af" font-size="13">result + failure</text></g>
</g><g stroke="#64748b" stroke-width="3"><path d="M205 171H235"/><path d="M395 171H425"/><path d="M585 171H615"/><path d="M775 171H805"/><path d="M965 171H995"/></g>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"><rect x="245" y="278" width="710" height="92" rx="18" fill="#111827" stroke="#334155"/><text x="600" y="313" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">Next AI starts with the verified state — not a blank chat</text><text x="600" y="344" text-anchor="middle" fill="#94a3b8" font-size="16">Failed approaches become memory. Stale context is invalidated. Successful work becomes handoff evidence.</text></g>
<path d="M1080 220C1080 396 130 396 130 220" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="8 8" opacity=".5"/>
</svg>