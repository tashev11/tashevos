<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title">
<title id="title">TashevOS terminal demo</title><rect width="1200" height="600" rx="28" fill="#0b1020"/><rect x="38" y="38" width="1124" height="524" rx="20" fill="#050914" stroke="#334155"/>
<circle cx="72" cy="72" r="7" fill="#fb7185"/><circle cx="96" cy="72" r="7" fill="#fbbf24"/><circle cx="120" cy="72" r="7" fill="#4ade80"/>
<g font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="19"><text x="70" y="126" fill="#67e8f9">$ tash init .</text>
<text x="70" y="166" fill="#f8fafc" font-weight="700">TashevOS initialized</text><text x="70" y="199" fill="#94a3b8">Project: /workspace/app</text><text x="70" y="230" fill="#94a3b8">Stack: Node.js/JavaScript, TypeScript</text>
<text x="70" y="261" fill="#86efac">AI: Claude Code, OpenAI Codex, Gemini CLI, Qwen Code</text><text x="70" y="292" fill="#94a3b8">Adapters: AGENTS.md, CLAUDE.md, GEMINI.md</text>
<text x="70" y="342" fill="#67e8f9">$ tash doctor</text><text x="70" y="378" fill="#86efac">✓ Git repository: detected</text><text x="70" y="409" fill="#86efac">✓ TashevOS store: initialized</text><text x="70" y="440" fill="#86efac">✓ Local event store: writable</text><text x="70" y="471" fill="#86efac">✓ Agent bootstrap: AGENTS.md present</text>
<text x="70" y="521" fill="#67e8f9">$ tash context "continue from the last AI"</text><text x="645" y="521" fill="#a78bfa">→ compact verified context packet</text></g>
</svg>