<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title">
<title id="title">TashevOS architecture</title><rect width="1200" height="680" rx="28" fill="#0b1020"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"><text x="60" y="62" fill="#fff" font-size="34" font-weight="800">Project-centric architecture</text><text x="60" y="96" fill="#94a3b8" font-size="18">The project is the source of continuity. AI clients are replaceable adapters.</text></g>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700">
<rect x="60" y="130" width="1080" height="86" rx="20" fill="#111827" stroke="#334155"/><text x="600" y="163" text-anchor="middle" fill="#cbd5e1">AI CLIENTS</text>
<g fill="#e0f2fe"><text x="145" y="194">Claude</text><text x="300" y="194">Codex</text><text x="445" y="194">Cursor</text><text x="585" y="194">Gemini</text><text x="730" y="194">Copilot</text><text x="875" y="194">Windsurf</text><text x="1020" y="194">More…</text></g>
<rect x="60" y="252" width="1080" height="84" rx="20" fill="#172554" stroke="#3b82f6"/><text x="600" y="286" text-anchor="middle" fill="#bfdbfe">ADAPTER + PROTOCOL LAYER</text><text x="600" y="315" text-anchor="middle" fill="#dbeafe" font-weight="500">MCP · hooks · rules · session import · capability registry</text>
<rect x="60" y="372" width="330" height="170" rx="20" fill="#13293d" stroke="#22d3ee"/><text x="225" y="410" text-anchor="middle" fill="#a5f3fc">CONTEXT ENGINE</text><text x="92" y="447" fill="#dbeafe" font-weight="500">• task-aware retrieval</text><text x="92" y="478" fill="#dbeafe" font-weight="500">• token budget</text><text x="92" y="509" fill="#dbeafe" font-weight="500">• retrieval receipts</text>
<rect x="435" y="372" width="330" height="170" rx="20" fill="#261b3d" stroke="#a78bfa"/><text x="600" y="410" text-anchor="middle" fill="#ddd6fe">MEMORY + RECONCILIATION</text><text x="467" y="447" fill="#ede9fe" font-weight="500">• decisions + failures</text><text x="467" y="478" fill="#ede9fe" font-weight="500">• provenance + freshness</text><text x="467" y="509" fill="#ede9fe" font-weight="500">• Git/files/tests truth</text>
<rect x="810" y="372" width="330" height="170" rx="20" fill="#193626" stroke="#4ade80"/><text x="975" y="410" text-anchor="middle" fill="#bbf7d0">DOCTOR + SAFETY</text><text x="842" y="447" fill="#dcfce7" font-weight="500">• risk classification</text><text x="842" y="478" fill="#dcfce7" font-weight="500">• verified auto-healing</text><text x="842" y="509" fill="#dcfce7" font-weight="500">• rollback + guardrails</text>
</g><g stroke="#64748b" stroke-width="3" fill="none"><path d="M600 216V250"/><path d="M600 336V360"/><path d="M225 360V372"/><path d="M975 360V372"/></g>
<rect x="60" y="582" width="1080" height="54" rx="17" fill="#111827" stroke="#334155"/><text x="600" y="616" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700">GIT · FILES · TESTS · RUNTIME = SOURCE OF TRUTH</text>
</svg>