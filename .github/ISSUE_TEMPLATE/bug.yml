name: Bug report
description: Report a reproducible TashevOS problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps and relevant command output. Remove secrets and private session content.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TashevOS version
  - type: input
    id: environment
    attributes:
      label: OS / Node / AI client
